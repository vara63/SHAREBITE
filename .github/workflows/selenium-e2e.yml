name: SHAREBITE Selenium E2E Automation Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  selenium-e2e-test:
    name: Run Cross-Browser Selenium E2E Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: [ chrome ]

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: 3. Install Root & Test Dependencies
        run: |
          npm ci || npm install
          cd frontend && npm ci || npm install
          cd ../selenium-tests && npm install

      - name: 4. Build Frontend Application
        run: |
          cd frontend
          npm run build

      - name: Start Frontend HTTP Server
        run: |
          python3 -m http.server 5173 --directory frontend/dist &
          sleep 3

      - name: 6. Execute Selenium End-to-End Tests
        env:
          BASE_URL: http://localhost:5173
          CROSS_BROWSER: ${{ matrix.browser }}
          HEADLESS: "true"
        run: |
          cd selenium-tests
          npm test

      - name: 7. Verify & Format Excel Report Output
        if: always()
        run: |
          cd selenium-tests
          ls -la reports/
          npm run report:excel || true

      - name: 8. Upload E2E Test Artifacts (Excel & HTML Reports, Screenshots, Logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-e2e-reports-${{ matrix.browser }}
          path: |
            selenium-tests/reports/E2E_Report.xlsx
            selenium-tests/reports/mochawesome-report/
            selenium-tests/screenshots/
            selenium-tests/logs/
            selenium-tests/reports/failures/
          retention-days: 30
